<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPL Exam Prep — Reading List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f9f8f6; --surface: #ffffff; --border: #e5e3df;
      --text: #1a1917; --text-muted: #6b6860; --accent: #2563eb; --accent-light: #dbeafe;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.6; padding: 3rem 1.5rem 6rem; }
    .container { max-width: 680px; margin: 0 auto; }
    .breadcrumb { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 2rem; }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    header { margin-bottom: 2.5rem; }
    header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
    header p { color: var(--text-muted); }
    .empty { background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 3rem 2rem; text-align: center; color: var(--text-muted); }
    .empty p { margin-bottom: 0.4rem; }
    .empty .label { font-size: 0.8rem; }
  </style>
</head>
<body>
<div class="container">
  <nav class="breadcrumb"><a href="../">Reading List</a> &rsaquo; PPL Exam Prep</nav>
  <header>
    <h1>PPL Exam Prep ✈️</h1>
    <p>Private Pilot License written exam — FAA study material and notes.</p>
  </header>
  <div class="empty">
    <p>Nothing here yet.</p>
    <p class="label">Coming soon — ACS, Pilot's Handbook of Aeronautical Knowledge, weather, regs.</p>
  </div>
</div>
</body>
</html>
