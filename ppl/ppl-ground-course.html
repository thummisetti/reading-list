<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPL Ground Course — Reading List</title>
</head>
<body>
  <noscript>
    <main style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;max-width:720px;margin:4rem auto;padding:0 1.5rem">
      <h1>PPL Ground Course</h1>
      <p>JavaScript is required for the integrated course page.</p>
      <p><a href="lesson-notes/index.html">Open lesson notes</a></p>
    </main>
  </noscript>
  <script>
    const courseSource = 'https://raw.githubusercontent.com/thummisetti/reading-list/166bcff4ec075e1a56716a98dfe17c7608df9195/ppl/ppl-ground-course.html';

    const notesCss = `
      .btn-notes { background: white; color: var(--accent); border: 1.5px solid var(--accent); }
      .btn-notes:hover { background: var(--accent-light); opacity: 1; }
    `;

    Promise.all([
      fetch(courseSource).then(response => {
        if (!response.ok) throw new Error('Unable to load course content');
        return response.text();
      }),
      fetch('lesson-notes/index.html').then(response => {
        if (!response.ok) throw new Error('Unable to load notes index');
        return response.text();
      })
    ]).then(([courseHtml, notesIndexHtml]) => {
      const parsedIndex = new DOMParser().parseFromString(notesIndexHtml, 'text/html');
      const noteLinks = {};

      parsedIndex.querySelectorAll('.lesson').forEach(row => {
        const rawNumber = row.querySelector('.num')?.textContent.trim();
        const link = row.querySelector('a[href$=".html"]');
        const href = link?.getAttribute('href');
        if (!rawNumber || !href) return;
        const number = rawNumber.replace(/^0+(?=\d)/, '');
        noteLinks[number] = href;
      });

      const notesJs = `
        (() => {
          const noteLinks = ${JSON.stringify(noteLinks)};
          document.querySelectorAll('.lesson').forEach(card => {
            const rawNumber = card.querySelector('.l-num')?.textContent.trim();
            const number = rawNumber ? rawNumber.replace(/^0+(?=\\d)/, '') : '';
            const href = noteLinks[number];
            const actions = card.querySelector('.actions');
            if (!href || !actions || actions.querySelector('.btn-notes')) return;

            const link = document.createElement('a');
            link.className = 'btn btn-notes';
            link.href = 'lesson-notes/' + href.replace(/^\\.\\//, '');
            link.innerHTML = '&#128214; Read Notes';

            const quiz = actions.querySelector('.btn-quiz');
            if (quiz) actions.insertBefore(link, quiz);
            else actions.appendChild(link);
          });
        })();
      `;

      courseHtml = courseHtml.replace('</head>', `<style>${notesCss}</style></head>`);
      courseHtml = courseHtml.replace('</body>', `<script>${notesJs}<\/script></body>`);

      document.open();
      document.write(courseHtml);
      document.close();
    }).catch(error => {
      document.body.innerHTML = `
        <main style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;max-width:720px;margin:4rem auto;padding:0 1.5rem">
          <h1>PPL Ground Course</h1>
          <p>${error.message}.</p>
          <p><a href="lesson-notes/index.html">Open lesson notes</a></p>
        </main>`;
    });
  </script>
</body>
</html>
